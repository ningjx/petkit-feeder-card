name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  build-and-release:
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Commit dist file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/petkit-feeder-card.js
          git diff --staged --quiet || git commit -m "build: update dist file for ${{ steps.version.outputs.VERSION }}"
          git push origin main

      - name: Update tag
        run: |
          git tag -f ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }} --force

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "plugin"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/petkit-feeder-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}